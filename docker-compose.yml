version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: ecotravel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=reservation_system
    volumes:
      - mongo_data:/data/db

  # Node.js Express REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecotravel-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/reservation_system
      - JWT_SECRET=ecotravel_jwt_secret_super_secure_key_2026
      - NODE_ENV=production
    depends_on:
      - mongodb

  # Customer Portal (Next.js - Port 3000)
  customer:
    build:
      context: ./apps/customer
      dockerfile: Dockerfile
    container_name: ecotravel-customer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

  # Supplier Dashboard (Next.js - Port 3001)
  supplier:
    build:
      context: ./apps/supplier
      dockerfile: Dockerfile
    container_name: ecotravel-supplier
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

  # Admin Management Portal (Next.js - Port 3002)
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: ecotravel-admin
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
